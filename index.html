<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DODGEDASH — 炸弹闯关</title>
<link rel="icon" href="data:,">
<style>
  :root{ --cyan:#00f6ff; --pink:#ff2d78; --orange:#ff9e2c; --green:#38ffb0; --bg:#04050c; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace,'PingFang SC','Microsoft YaHei','Noto Sans SC','WenQuanYi Micro Hei',sans-serif;
    color:#c9fbff;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #game{ position:fixed; inset:0; display:block; touch-action:none; cursor:crosshair; }

  #hudBtns{ position:fixed; top:10px; right:10px; display:flex; gap:8px; z-index:8; }
  .hud-btn{
    font:inherit; font-size:12px; letter-spacing:1px; color:rgba(201,251,255,0.9);
    background:rgba(6,10,22,0.7); border:1px solid rgba(0,246,255,0.35);
    border-radius:8px; padding:10px 12px; cursor:pointer; min-height:40px; min-width:44px;
    transition:all .15s;
  }
  .hud-btn:hover{ border-color:var(--cyan); box-shadow:0 0 12px rgba(0,246,255,0.5); color:#fff; }

  #dropBtn{
    position:fixed; right:14px; bottom:18px; z-index:8;
    font:inherit; font-weight:700; font-size:13px; letter-spacing:2px;
    color:#04050c; background:linear-gradient(90deg,#ff9e2c,#ff2d78);
    border:none; border-radius:999px; padding:16px 22px; min-height:52px;
    box-shadow:0 0 18px rgba(255,158,44,0.5); cursor:pointer; opacity:.45;
    transition:all .15s; touch-action:none;
  }
  #dropBtn.active{ opacity:1; box-shadow:0 0 28px rgba(255,158,44,0.9); transform:scale(1.05); }
  #dropBtn:active{ transform:scale(.95); }

  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(4,5,12,0.35), rgba(4,5,12,0.85));
    backdrop-filter:blur(3px); }
  .overlay.hidden{ display:none; }
  .panel{ text-align:center; padding:40px 52px; border:1px solid rgba(0,246,255,0.35); border-radius:14px;
    background:rgba(6,10,22,0.82); box-shadow:0 0 30px rgba(0,246,255,0.18), inset 0 0 40px rgba(0,246,255,0.05);
    animation:panelIn .35s ease-out; max-width:92vw; max-height:92vh; overflow:auto; }
  h1{ font-size:42px; letter-spacing:10px; font-weight:800;
    background:linear-gradient(90deg,var(--cyan),#b967ff,var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(0,246,255,0.45)); margin-bottom:8px; }
  .subtitle{ color:rgba(201,251,255,0.6); font-size:11px; letter-spacing:5px; margin-bottom:28px; }
  .big-btn{ font:inherit; font-size:16px; letter-spacing:5px; font-weight:700; color:#04050c;
    background:linear-gradient(90deg,var(--cyan),#38ffb0); border:none; padding:16px 46px; min-height:52px;
    border-radius:8px; cursor:pointer; box-shadow:0 0 24px rgba(0,246,255,0.55);
    transition:transform .12s ease, box-shadow .12s ease; }
  .big-btn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 0 36px rgba(0,246,255,0.85); }
  .big-btn:active{ transform:scale(.97); }
  .hint{ margin-top:20px; font-size:11px; letter-spacing:2px; color:rgba(201,251,255,0.5); line-height:2; }
  kbd{ border:1px solid rgba(201,251,255,0.35); border-bottom-width:2px; border-radius:4px;
    padding:2px 7px; font-size:10px; color:rgba(201,251,255,0.8); }

  .paused-text{ font-size:30px; letter-spacing:12px; color:#d9fdff; text-shadow:0 0 14px var(--cyan); }
  .stat-label{ font-size:11px; letter-spacing:3px; color:rgba(201,251,255,0.55); margin-top:14px; }
  .big-num{ font-size:40px; font-weight:800; color:#d9fdff; letter-spacing:2px;
    text-shadow:0 0 12px var(--cyan), 0 0 34px rgba(0,246,255,0.7); }
  #victoryStats{ margin:16px auto 0; text-align:left; display:inline-block; font-size:12px; letter-spacing:2px;
    color:rgba(201,251,255,0.75); line-height:2.1; }
  #victoryStats b{ color:#38ffb0; }


  @keyframes panelIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  @media (max-width:600px){
    .panel{ padding:30px 20px; }
    h1{ font-size:28px; letter-spacing:5px; }
    .big-num{ font-size:32px; }
    .big-btn{ font-size:14px; padding:14px 30px; }
    #dropBtn{ padding:14px 18px; font-size:12px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudBtns">
  <button class="hud-btn" id="pauseBtn">&#10074;&#10074;</button>
  <button class="hud-btn" id="muteBtn">声音 开</button>
</div>
<button id="dropBtn">放下炸弹</button>

<div class="overlay" id="menuOverlay">
  <div class="panel">
    <h1>DODGEDASH</h1>
    <div class="subtitle">搬运 &middot; 投掷 &middot; 生存</div>
    <button class="big-btn" id="startBtn">开始</button>
    <div class="hint">
      移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd><br>
      触屏拖动即可移动 &middot; 双指轻触 = 放下炸弹 &middot; <kbd>E</kbd> 放下炸弹 &middot; <kbd>P</kbd> 暂停<br>
      你没有武器。敌人的攻击击中炸弹会将其引爆 &mdash; 快跑开！
    </div>
  </div>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="panel">
    <div class="paused-text">已暂停</div>
    <button class="big-btn" id="resumeBtn" style="margin-top:24px">继续</button>
    <div class="hint">按 <kbd>P</kbd> 继续</div>
  </div>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="panel">
    <h1>游戏结束</h1>
    <div class="stat-label">最终得分</div>
    <div class="big-num" id="overScore">0</div>
    <div class="stat-label">最佳成绩 &nbsp;<span id="overBest">0</span></div>
    <button class="big-btn" id="retryBtn" style="margin-top:24px">重试</button>
    <div class="hint">按 <kbd>R</kbd> 或 <kbd>ENTER</kbd> 重试</div>
  </div>
</div>

<div class="overlay hidden" id="victoryOverlay">
  <div class="panel">
    <h1>通关！</h1>
    <div class="subtitle" style="margin-bottom:10px">第 1 关 通关</div>
    <div class="stat-label">得分 &nbsp;&middot;&nbsp; 用时</div>
    <div class="big-num" id="vicScoreTime">0 &middot; 00:00</div>
    <div class="stat-label">最佳成绩 &nbsp;<span id="vicBest">0</span></div>
    <div id="victoryStats"></div>
    <div><button class="big-btn" id="vicRetryBtn" style="margin-top:20px">再玩一次</button></div>
    <div class="hint">按 <kbd>R</kbd> 或 <kbd>ENTER</kbd> 再来一局</div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   DODGEDASH — single-file dodge/strategy game (vanilla JS)
   Sections: Setup | Audio | Input | Player | Bombs | Hammers
             Black Monsters | Boss (Red Snake) | Freeze Turret
             Bullets & Spikes | FX | Upgrades | Level | Update
             Render | HUD | Flow | Test API
   ============================================================ */

/* ---------------- Setup ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn'), dropBtn = $('dropBtn');
const menuOverlay = $('menuOverlay'), pauseOverlay = $('pauseOverlay');
const overOverlay = $('overOverlay'), victoryOverlay = $('victoryOverlay');
const startBtn = $('startBtn'), resumeBtn = $('resumeBtn'), retryBtn = $('retryBtn'), vicRetryBtn = $('vicRetryBtn');
const overScore = $('overScore'), overBest = $('overBest');
const vicScoreTime = $('vicScoreTime'), vicBest = $('vicBest'), victoryStats = $('victoryStats');

const TAU = Math.PI * 2;
const GAME_FONT = 'Courier New,ui-monospace,SFMono-Regular,Menlo,monospace,"PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const easeOut = t => 1 - (1 - t) * (1 - t);

let W = 0, H = 0, dpr = 1, groundY = 0, bgCanvas = null, stars = [];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  groundY = H - 64;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBackground();
  buildStars();
}

function buildBackground() {
  bgCanvas = null;
  try {
    const c = document.createElement('canvas');
    const cctx = c.getContext && c.getContext('2d');
    if (!cctx) return;
    c.width = Math.max(2, Math.round(W * dpr));
    c.height = Math.max(2, Math.round(H * dpr));
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.fillStyle = '#04050c';
    cctx.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => {
      const g = cctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, col);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      cctx.fillStyle = g;
      cctx.fillRect(0, 0, W, H);
    };
    blob(W * 0.25, H * 0.3, W * 0.55, 'rgba(0,120,255,0.10)');
    blob(W * 0.8, H * 0.7, W * 0.6, 'rgba(255,45,120,0.08)');
    blob(W * 0.55, H * 0.12, W * 0.42, 'rgba(185,103,255,0.07)');
    const vg = cctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    cctx.fillStyle = vg;
    cctx.fillRect(0, 0, W, H);
    bgCanvas = c;
  } catch (e) { bgCanvas = null; }
}

function buildStars() {
  stars = [];
  const n = Math.floor(W * H / 9000);
  for (let i = 0; i < n; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 1.8), depth: rand(0.25, 0.9), tw: rand(0, TAU) });
  }
}
window.addEventListener('resize', resize);

/* ---------------- State ---------------- */
let state = 'menu'; // menu | playing | paused | over | victory
let elapsed = 0, score = 0, best = 0, kills = 0, upgradesUsed = 0;
let shake = 0, hitFlash = 0, freezeFlash = 0;
let phase = 1, bossSpawned = false, bossDefeated = false, bossMaxHp = 0;
let bombRadiusUp = 0;
let player = null;
let hammers = [], blacks = [], snakes = [], turrets = [], bullets = [], spikes = [], bombs = [];
let particles = [], shockwaves = [], popups = [];
let bombTimer = 1.5, hammerTimer = 3;
let pickups = [], pickupTimer = rand(8, 14);
const PICKUP_TYPES = ['heal', 'shield', 'speed', 'bomb'];
let stats = { hammers: 0, blacks: 0, turrets: 0, boss: 0 };
let hintText = '', hintTimer = 0;
let orbs = [], orbTimer = rand(40, 55), orbsSpawned = 0, orbMax = 3, pityActive = false;
let energy = 0;
let blackSpawned = false, turretSpawned = false;
const BEST_KEY = 'dodgeDash.best';
let muted = false;
try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}
try { muted = localStorage.getItem('dodgeDash.muted') === '1'; } catch (e) {}
muteBtn.textContent = muted ? '声音 关' : '声音 开';

/* ---------------- Audio ---------------- */
let audioCtx = null, audioReady = false;
function initAudio() {
  if (audioReady) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { audioCtx = new AC(); audioReady = true; }
  } catch (e) {}
}
function tone(freq, dur, type, vol, endFreq, delay) {
  if (muted || !audioReady) return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noise(dur, vol, delay) {
  if (muted || !audioReady) return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(t0);
  } catch (e) {}
}
const sfx = {
  pickup() { tone(700, 0.08, 'square', 0.05, 1100); },
  drop() { tone(280, 0.12, 'sine', 0.08, 160); },
  explosion() { noise(0.5, 0.3); tone(80, 0.5, 'sine', 0.3, 28); },
  hammer() { noise(0.15, 0.16); tone(110, 0.16, 'square', 0.18, 55); },
  wind() { noise(0.8, 0.07); tone(95, 0.8, 'sine', 0.05, 42); },
  freeze() { tone(1600, 0.35, 'sine', 0.07, 280); },
  split() { tone(220, 0.12, 'sawtooth', 0.12, 90); tone(330, 0.12, 'sawtooth', 0.1, 120, 0.1); },
  upgrade() { [440, 660, 880, 1320].forEach((f, i) => tone(f, 0.16, 'triangle', 0.11, undefined, i * 0.09)); },
  death() { tone(300, 0.6, 'sawtooth', 0.14, 40); noise(0.5, 0.2, 0.05); },
  victory() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.12, undefined, i * 0.12)); },
  click() { tone(700, 0.05, 'square', 0.04, 480); },
  hurt() { tone(200, 0.18, 'square', 0.12, 90); }
};
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('dodgeDash.muted', muted ? '1' : '0'); } catch (e) {}
  muteBtn.textContent = muted ? '声音 关' : '声音 开';
  if (!muted) { initAudio(); sfx.click(); }
}
muteBtn.addEventListener('click', toggleMute);

/* ---------------- Input ---------------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (state === 'menu' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); return; }
  if ((state === 'over' || state === 'victory') && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) { startGame(); return; }
  if ((state === 'playing' || state === 'paused') && (e.code === 'KeyP' || e.code === 'Escape')) { togglePause(); return; }
  if (state === 'playing' && (e.code === 'KeyE' || e.code === 'Space')) { dropBomb(); return; }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { if (state === 'playing') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pauseGame(); });

const touch = { active: false, mainId: null, count: 0, lx: 0, ly: 0 };
canvas.addEventListener('pointerdown', e => {
  touch.count++;
  if (!touch.active) {
    touch.active = true;
    touch.mainId = e.pointerId;
    touch.lx = e.clientX;
    touch.ly = e.clientY;
  } else if (state === 'playing' && player && player.carrying.length) {
    // second finger while the first is dragging → drop a bomb immediately
    dropBomb();
    showHint('已放下炸弹', 1.6);
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== touch.mainId || !touch.active || state !== 'playing' || !player) return;
  const dx = e.clientX - touch.lx, dy = e.clientY - touch.ly;
  touch.lx = e.clientX; touch.ly = e.clientY;
  const pushed = hammers.some(h => h.pushingPlayer && h.state === 'strike');
  if (player.frozen <= 0 && !pushed) {
    player.x += dx; player.y += dy;
    player.vy = clamp(dy * 60, -260, 260);
    clampPlayer();
  }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  canvas.addEventListener(ev, e => {
    touch.count = Math.max(0, touch.count - 1);
    if (e.pointerId === touch.mainId) { touch.active = false; touch.mainId = null; }
  })
);
dropBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'playing') dropBomb(); });
pauseBtn.addEventListener('click', () => { if (state === 'playing' || state === 'paused') togglePause(); });
resumeBtn.addEventListener('click', () => { if (state === 'paused') togglePause(); });

/* ---------------- Player ---------------- */
function makePlayer() {
  return {
    x: W * 0.5, y: H * 0.72, r: 14,
    baseSpeed: 230, speedMul: 1, maxHp: 6, hp: 6,
    invuln: 0, shield: 0.8, frozen: 0, carrying: [], carryCap: 1, dead: false, bob: 0,
    vy: 0, engT: 0
  };
}
function clampPlayer() {
  const p = player;
  p.x = clamp(p.x, 20, W - 20);
  p.y = clamp(p.y, H * 0.12, H - 78);
}
function damagePlayer(amount, sx, sy) {
  const p = player;
  if (state !== 'playing' || p.dead || p.invuln > 0) return;
  if (p.frozen > 0) { amount *= 2; p.frozen = 0; }
  p.hp -= amount;
  hitFlash = 1;
  shake = Math.min(shake + 8, 20);
  sfx.hurt();
  addPopup(p.x, p.y - 26, '-' + amount + ' 生命', '#ff5c9d');
  if (sx !== undefined) {
    const a = Math.atan2(p.y - sy, p.x - sx);
    p.x += Math.cos(a) * 16;
    p.y += Math.sin(a) * 16;
    clampPlayer();
  }
  p.invuln = p.shield;
  if (p.hp <= 0) { p.hp = 0; p.dead = true; gameOver(); }
}
function freezePlayer(dur) {
  if (!player || player.dead) return;
  player.frozen = Math.max(player.frozen, dur);
  freezeFlash = 1;
  sfx.freeze();
  addPopup(player.x, player.y - 28, '被冰冻！', '#7fe9ff');
}

/* ---------------- Bombs ---------------- */
function carryOffset(slot) {
  return { x: 18 + slot * 8, y: -12 + slot * 6 };
}
function spawnBomb() {
  const x = rand(30, W - 20), y = rand(H * 0.25, H - 150);
  bombs.push({ x, y, px: 0, py: 0, r: 11, vy: 0, vx: 0, carried: false, noPickup: 0, exploded: false, wob: rand(0, TAU) });
}
function bombScreenX(b) { return b.carried ? b.px : b.x; }
function bombScreenY(b) { return b.carried ? b.py : b.y; }
function pickBomb(b) {
  if (player.carrying.length >= player.carryCap) return;
  b.carried = true;
  player.carrying.push(b);
  b.slot = player.carrying.length - 1;
  const off = carryOffset(b.slot);
  b.px = player.x + off.x; b.py = player.y + off.y;
  sfx.pickup();
  addPopup(player.x, player.y - 30, '已拾取炸弹', '#ff9e2c');
}
function dropBomb() {
  const p = player;
  if (!p.carrying.length || state !== 'playing') return;
  const b = p.carrying.pop();
  b.carried = false;
  b.x = b.px; b.y = b.py;
  b.vx = 0; b.vy = 0; b.noPickup = 0.5;
  sfx.drop();
  addPopup(b.x, b.y - 20, '放下炸弹', '#ff9e2c');
}
function updateBombs(dt) {
  bombTimer -= dt;
  const cap = phase >= 4 ? 3 : 2;
  if (bombTimer <= 0 && bombs.filter(b => !b.carried).length < cap) {
    bombTimer = phase >= 4 ? 4 : 4.6;
    spawnBomb();
  }
  const p = player;
  for (const b of [...bombs]) {
    if (b.exploded) continue;
    if (b.carried) {
      p.bob += dt * 5;
      const off = carryOffset(b.slot);
      const tx = p.x + off.x, ty = p.y + off.y + Math.sin(p.bob + b.slot) * 3;
      const carrySpeed = bombRadiusUp > 0 ? 16 : 8; // 'Bomb Mastery' upgrade = faster carry
      b.px += (tx - b.px) * Math.min(1, carrySpeed * dt);
      b.py += (ty - b.py) * Math.min(1, carrySpeed * dt);
      continue;
    }
    b.noPickup = Math.max(0, b.noPickup - dt);
    b.x += b.vx * dt; b.y += b.vy * dt; b.wob += dt * 2;
    if (b.noPickup <= 0 && !p.dead && p.carrying.length < p.carryCap && dist(p, { x: b.x, y: b.y }) < 44) { pickBomb(b); continue; }
    if (b.y > H + 30 || b.x < -50) removeBomb(b);
  }
  dropBtn.classList.toggle('active', p.carrying.length > 0);
}
function removeBomb(b) { const i = bombs.indexOf(b); if (i >= 0) bombs.splice(i, 1); }
function explodeBomb(b) {
  if (b.exploded) return;
  b.exploded = true;
  const sx = bombScreenX(b), sy = bombScreenY(b);
  const rad = Math.min(108, 72 * (1 + 0.3 * bombRadiusUp));
  const ci = player.carrying.indexOf(b);

  removeBomb(b);
  shake = Math.min(shake + 16, 26);

  addShockwave(sx, sy, rad * 1.15);
  addBurst(sx, sy, 42, ['#ff9e2c', '#ffd9a0', '#ffffff'], 220, 0.25);
  // player (no friendly distinction)
  // player: only hurt near the blast core (tighter hitbox than enemies)
  if (!player.dead && dist(player, { x: sx, y: sy }) < rad * 0.55 + player.r) damagePlayer(2, sx, sy);
  // elite hammers: rectangular hitbox, 2 HP (needs 2 blasts)
  for (const h of [...hammers]) {
    const hp = hammerPos(h);
    if (Math.abs(sx - h.x) < rad + h.hw && Math.abs(sy - hp.y) < rad + h.hh) {
      h.frozen = 0;
      h.hp -= 1;
      h.cracked = h.hp <= 1;
      if (h.hp <= 0) destroyHammer(h);
      else {
        sfx.split();
        addPopup(h.x, h.targetY - 46, '精英锤兵 受损！再炸一次！', '#ff5c9d');
        addBurst(sx, sy, 18, '#ff5c9d', 180, 0.3);
      }
    }
  }
  // turrets
  for (const t of [...turrets]) {
    if (dist(t, { x: sx, y: sy }) < rad + t.r) {
      const dmg = 4 * (t.frozen > 0 ? 2 : 1);
      t.frozen = 0;
      t.hp -= dmg;
      if (t.hp <= 0) destroyTurret(t);
    }
  }
  // black monsters
  for (const bk of [...blacks]) {
    if (dist(bk, { x: sx, y: sy }) < rad + bk.r) {
      if (bk.sleeping) wakeBlack(bk);
      const dmg = 4 * (bk.frozen > 0 ? 2 : 1);
      bk.frozen = 0;
      bk.hp -= dmg;
      if (bk.hp <= 0) killBlack(bk);
    }
  }
  // red snakes (middle hit => split)
  applyExplosionToSnakes(sx, sy, rad);
  checkVictory();
}

/* ---------------- Hammers: rectangular ELITE units (4-column) ---------------- */
const ELITE_COLS = 4;
const HAMMER_TOP = -160;
const HAMMER_STRIKE_DUR = 0.85;
const HAMMER_RAISE_DUR = 0.9;
function pickHammerColumns(count) {
  const cols = [0, 1, 2, 3];
  for (let i = cols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  return cols.slice(0, count);
}
function spawnHammerPair() {
  for (const c of pickHammerColumns(2)) spawnHammerAt(c);
}
function spawnHammerAt(col) {
  const colW = W / ELITE_COLS;
  const h = {
    col: clamp(Math.round(col), 0, ELITE_COLS - 1),
    x: (clamp(Math.round(col), 0, ELITE_COLS - 1) + 0.5) * colW,
    y: HAMMER_TOP,
    hw: W * 0.14, hh: 40,
    hp: 2, maxHp: 2, cracked: false,
    targetY: H - 88,
    state: 'telegraph', timer: rand(0.8, 1.4),
    frozen: 0, impacted: false,
    dmg: 0, hitPlayer: false, pushingPlayer: false, pushDone: false
  };
  hammers.push(h);
  showHint('精英锤兵 来袭！', 3.5);
  return h;
}
function spawnHammerElite() {
  const occupied = hammers.map(h => h.col);
  const free = [0, 1, 2, 3].filter(c => !occupied.includes(c));
  if (!free.length) return null;
  const h = spawnHammerAt(pick(free));
  h.state = 'telegraph'; h.timer = rand(1.6, 2.4);
  return h;
}
function hammerPos(h) {
  if (h.state === 'strike') {
    const p = clamp(1 - h.timer / HAMMER_STRIKE_DUR, 0, 1);
    return { x: h.x, y: HAMMER_TOP + (h.targetY - HAMMER_TOP) * easeOut(p) };
  }
  if (h.state === 'raise') {
    const p = clamp(1 - h.timer / HAMMER_RAISE_DUR, 0, 1);
    return { x: h.x, y: h.targetY - (h.targetY - HAMMER_TOP) * easeOut(p) };
  }
  return { x: h.x, y: HAMMER_TOP };
}
function hammerHitPlayer(h, amount) {
  const p = player;
  if (state !== 'playing' || !p || p.dead) return;
  const allow = Math.min(amount, 2 - h.dmg); // one hammer event can never cost more than 2 HP
  if (allow <= 0) return;
  h.dmg += allow;
  p.hp -= allow;
  hitFlash = 1;
  shake = Math.min(shake + 8, 20);
  sfx.hurt();
  addPopup(p.x, p.y - 26, '-' + allow + ' 生命', '#ff5c9d');
  p.invuln = Math.max(p.invuln, p.shield);
  if (p.hp <= 0) { p.hp = 0; p.dead = true; gameOver(); }
}
function updateHammers(dt) {
  for (const h of [...hammers]) {
    if (h.frozen > 0) {
      h.frozen -= dt;
      h.pushingPlayer = false;
      continue;
    }
    h.timer -= dt;
    if (h.state === 'telegraph') {
      if (h.timer <= 0) {
        h.state = 'strike'; h.timer = HAMMER_STRIKE_DUR;
        h.dmg = 0; h.hitPlayer = false; h.pushingPlayer = false; h.pushDone = false;
        h.impacted = false;
        sfx.wind();
      }
    } else if (h.state === 'strike') {
      // heavy fall: faint rumble while the hammer is coming down
      if (h.timer > 0.25) shake = Math.min(shake + 1.8 * dt, 14);
      const hp = hammerPos(h);
      const p = player;
      if (p && !p.dead && Math.abs(p.x - h.x) < h.hw + p.r && Math.abs(p.y - hp.y) < h.hh + p.r) {
        if (!h.hitPlayer) {
          h.hitPlayer = true;
          if (p.y >= h.targetY - h.hh * 1.4) {
            // player already in the landing zone → single 2 HP hit
            hammerHitPlayer(h, 2);
            h.pushDone = true;
          } else {
            // contact while falling: 1 HP now, push down, 1 HP at the bottom
            hammerHitPlayer(h, 1);
            h.pushingPlayer = true;
          }
        } else if (h.pushingPlayer && !h.pushDone) {
          const landing = h.targetY - h.hh * 0.5;
          const target = hp.y + h.hh * 0.9;
          p.y = Math.min(Math.max(target, p.y), landing);
          if (p.y >= landing) { h.pushDone = true; hammerHitPlayer(h, 1); }
        }
      }
      if (!h.impacted && 1 - h.timer / HAMMER_STRIKE_DUR >= 0.92) { h.impacted = true; hammerImpact(h); }
      if (h.timer <= 0) { h.state = 'raise'; h.timer = HAMMER_RAISE_DUR; h.pushingPlayer = false; }
    } else if (h.state === 'raise') {
      if (h.timer <= 0) { h.state = 'telegraph'; h.timer = rand(1.0, 1.6); }
    }

}
function hammerImpact(h) {
  const zx = h.x, zy = h.targetY;
  shake = Math.min(shake + 9, 20);
  sfx.hammer();
  addShockwave(zx, zy, h.hw * 1.6);
  addBurst(zx, zy, 16, '#c9fbff', 180, 0.35);
  for (const b of [...bombs]) {
    if (!b.exploded && dist({ x: bombScreenX(b), y: bombScreenY(b) }, { x: zx, y: zy }) < h.hw + 14) explodeBomb(b);
  }
  for (const bk of [...blacks]) {
    if (dist(bk, { x: zx, y: zy }) < h.hw + bk.r) {
      wakeBlack(bk);
      const dmg = 4 * (bk.frozen > 0 ? 2 : 1);
      bk.frozen = 0;
      bk.hp -= dmg;
      if (bk.hp <= 0) killBlack(bk);
    }
  }
  for (const s of [...snakes]) {
    const frozen = s.frozen > 0;
    let hit = false;
    for (const seg of s.segments) {
      if (dist(seg, { x: zx, y: zy }) < h.hw + seg.r) { seg.hp -= 2 * (frozen ? 2 : 1); hit = true; }
    }
    if (hit) { if (frozen) s.frozen = 0; processSnakeDeaths(s); }
  }
  checkVictory();
}
function destroyHammer(h) {
  const i = hammers.indexOf(h);
  if (i >= 0) hammers.splice(i, 1);
  score += 300; kills++; stats.hammers++;
  addEnergy(15);
  addPopup(h.x, h.targetY - 46, '精英锤兵 摧毁 +300', '#ff5c9d');
  addBurst(h.x, h.targetY, 30, '#ff2d78', 220, 0.3);

/* ---------------- Black Monsters (farmable) ---------------- */
function spawnBlack(stage) {
  return {
    stage, x: rand(40, W - 40), y: -40,
    r: stage === 1 ? 18 : (stage === 2 ? 22 : 24),
    hp: 3 * stage, maxHp: 3 * stage, sleeping: stage === 1, wakeAt: rand(5, 9),
    timer: rand(0, TAU), ang: stage === 2 ? Math.PI / 2 : 0, frozen: 0, respawnIn: 0, zz: rand(0, TAU)
  };
}
function wakeBlack(bk) {
  if (!bk.sleeping) return;
  bk.sleeping = false;
  bk.ang = Math.PI / 2;
  addPopup(bk.x, bk.y - 30, '黑怪苏醒！', '#b967ff');
}
function updateBlacks(dt) {
  const p = player;
  for (const bk of [...blacks]) {
    if (bk.respawnIn > 0) { bk.respawnIn -= dt; if (bk.respawnIn <= 0) respawnBlack(bk); continue; }
    if (bk.frozen > 0) { bk.frozen -= dt; continue; }
    if (bk.sleeping) {
      bk.wakeAt -= dt; bk.zz += dt;
      if (bk.wakeAt <= 0) wakeBlack(bk);
    } else {
      bk.timer += dt;
      if (bk.stage === 1) {
        bk.x += Math.sin(bk.timer * 1.4) * 20 * dt; bk.y += 10 * dt;
        bk.ang = Math.PI / 2 + Math.sin(bk.timer * 1.4) * 0.4;
      } else if (bk.stage === 2) {
        bk.ang = Math.PI / 2 + Math.sin(bk.timer * 2.2) * 0.85;
        bk.x += Math.sin(bk.timer * 2.2) * 64 * dt; bk.y += 14 * dt;
      } else {
        const a = Math.atan2(p.y - bk.y, p.x - bk.x);
        bk.ang = turnToward(bk.ang, a, 1.6 * dt);
        bk.x += Math.cos(bk.ang) * 78 * dt; bk.y += Math.sin(bk.ang) * 78 * dt;
      }
    }
    if (bk.y > H + 50 || bk.x < -50 || bk.x > W + 50) bk.respawnIn = rand(2.5, 4.5);
    if (!p.dead && dist(p, bk) < bk.r + p.r) { wakeBlack(bk); damagePlayer(2, bk.x, bk.y); }
  }
}
function respawnBlack(bk) {
  const up = Math.random() < 0.45 && bk.stage < 3;
  if (up) bk.stage++;
  bk.x = rand(40, W - 40); bk.y = -44;
  bk.hp = 3 * bk.stage; bk.maxHp = 3 * bk.stage;
  bk.sleeping = false; bk.frozen = 0; bk.respawnIn = 0;
  bk.timer = rand(0, TAU); bk.ang = Math.PI / 2; bk.zz = rand(0, TAU);
  if (up) addPopup(clamp(bk.x, 60, W - 60), H * 0.25, '阶段 ' + bk.stage + '！', '#b967ff');
}
function killBlack(bk) {
  const i = blacks.indexOf(bk);
  if (i >= 0) blacks.splice(i, 1);
  const pts = 100 * Math.pow(2, bk.stage - 1);
  score += pts; kills++; stats.blacks++;
  addPopup(bk.x, bk.y - 24, '+' + pts, '#b967ff');

/* ---------------- Boss: Red Snake ---------------- */
function makeSnake(segs, stage2, spacing) {
  const head = segs[0];
  const headAng = player ? Math.atan2(player.y - head.y, player.x - head.x) : Math.PI / 2;
  return { segments: segs, timer: rand(0, TAU), frozen: 0, spikeTimer: 0.3, stage2: !!stage2, spacing: spacing || 34, headAng, distAcc: 0 };
}
function spawnBoss() {
  const segs = [];
  const startX = W * 0.5;
  const headY = Math.max(H * 0.12 + 20, 120);
  for (let i = 0; i < 10; i++) {
    segs.push({ x: startX + Math.sin(i * 0.9) * 14, y: headY - i * 34, r: i === 0 ? 14 : 11, hp: 2 });
  }
  snakes.push(makeSnake(segs, false));
  bossMaxHp = 10 * 2;
  addPopup(W * 0.5, H * 0.3, '红蛇王', '#ff2d78');
}
function totalBossHp() {
  let t = 0;
  for (const s of snakes) for (const g of s.segments) t += Math.max(0, g.hp);
  return t;
}
function updateSnakes(dt) {
  const p = player;
  for (const s of [...snakes]) {
    if (s.frozen > 0) { s.frozen -= dt; continue; }
    const head = s.segments[0];
    // snake-like turning: only up to ~12° per ~30px traveled, with inertia
    const speed = 125 * 0.75; // 25% slower than before
    const step = speed * dt;
    head.x += Math.cos(s.headAng) * step;
    head.y += Math.sin(s.headAng) * step;
    s.distAcc += step;
    if (s.distAcc >= 30) {
      s.distAcc -= 30;
      const a = Math.atan2(p.y - head.y, p.x - head.x);
      s.headAng = turnToward(s.headAng, a, 12 * Math.PI / 180);
    }
    head.x = clamp(head.x, -80, W + 80);
    head.y = clamp(head.y, H * 0.12, groundY - 8);
    // contact damage: any segment touching the player costs 1 HP (with knockback + i-frames)
    for (const seg of s.segments) {
      if (!p.dead && dist(p, seg) < seg.r + p.r) damagePlayer(1, seg.x, seg.y);
    }
    for (let i = 1; i < s.segments.length; i++) {
      const prev = s.segments[i - 1], seg = s.segments[i];
      const ox = Math.sin(s.timer * 5 + i * 0.9) * 5, oy = Math.cos(s.timer * 5 + i * 0.9) * 5;
      const tx = prev.x + ox, ty = prev.y + oy;
      const dx = seg.x - tx, dy = seg.y - ty, d = Math.hypot(dx, dy) || 0.001;
      const sp = s.spacing || 34;
      if (d > sp) { const push = (d - sp) / d; seg.x -= dx * push; seg.y -= dy * push; }
    }
    s.timer += dt;
    // stage 2: leave spikes along the path
    if (s.stage2) {
      s.spikeTimer -= dt;
      if (s.spikeTimer <= 0) { s.spikeTimer = 0.35; spikes.push({ x: head.x, y: groundY, t: 6 }); }
    }
  }
  const tot = totalBossHp();
  if (bossSpawned && !bossDefeated && tot > 0 && tot <= bossMaxHp * 0.6) {
    for (const s of snakes) s.stage2 = true;
  }
  if (bossSpawned && !bossDefeated && snakes.length === 0) {
    bossDefeated = true;
    showHint('红蛇王已被摧毁！清除锤兵与炮台即可通关', 5);
    sfx.split();
  }
  checkVictory();
}
function applyExplosionToSnakes(sx, sy, rad) {
  for (const s of [...snakes]) {
    const frozen = s.frozen > 0;
    let hit = false;
    for (const seg of s.segments) {
      if (dist(seg, { x: sx, y: sy }) < rad + seg.r) { seg.hp -= 4 * (frozen ? 2 : 1); hit = true; }
    }
    if (hit) { if (frozen) s.frozen = 0; processSnakeDeaths(s); }
  }
}
function processSnakeDeaths(s) {
  const idx = snakes.indexOf(s);
  if (idx < 0) return;
  const segs = s.segments;
  const dead = [];
  for (let i = 0; i < segs.length; i++) if (segs[i].hp <= 0) dead.push(i);
  if (!dead.length) return;
  const pts = dead.length * 200;
  score += pts; kills += dead.length; stats.boss += dead.length;
  const deadSeg = segs[dead[0]];
  addPopup(deadSeg.x, deadSeg.y - 20, '+' + pts, '#ff5c9d');
  const splitAt = dead.find(i => i > 0 && i < segs.length - 1);
  if (splitAt !== undefined) {
    const splitSeg = segs[splitAt];
    const partA = segs.slice(0, splitAt).filter(g => g.hp > 0);
    const partB = segs.slice(splitAt + 1).filter(g => g.hp > 0);
    snakes.splice(idx, 1);
    if (partA.length) snakes.push(makeSnake(partA, s.stage2, s.spacing));
    if (partB.length) snakes.push(makeSnake(partB, s.stage2, s.spacing));
    addPopup(splitSeg.x, splitSeg.y - 26, '分裂！', '#ff5c9d');
    addBurst(splitSeg.x, splitSeg.y, 22, '#ff2d78', 200, 0.3);
    sfx.split();
  } else {
    s.segments = segs.filter(g => g.hp > 0);
    if (s.segments.length === 0) snakes.splice(idx, 1);
  }
  addEnergy(6);
}

/* ---------------- Freeze Turret ---------------- */
function spawnTurret() {
  turrets.push({ x: W * 0.72, y: 44, r: 18, hp: 3, ang: Math.PI / 2, state: 'cooldown', timer: rand(8, 10), fireAng: 0, frozen: 0 });
}
function updateTurret(dt) {
  const p = player;
  for (const t of [...turrets]) {
    if (t.frozen > 0) { t.frozen -= dt; continue; }
    const ta = Math.atan2(p.y - t.y, p.x - t.x);
    if (t.state === 'cooldown') {
      // long cooldown (8-10s): completely no laser
      t.timer -= dt;
      if (t.timer <= 0) { t.state = 'aim'; t.timer = 3; sfx.freeze(); }
    } else if (t.state === 'aim') {
      // 3s aim: rotating laser locks onto the player
      t.ang = turnToward(t.ang, ta, 1.6 * dt);
      t.timer -= dt;
      if (t.timer <= 0) { t.state = 'fire'; t.timer = 0.3; }
    } else if (t.state === 'fire') {
      t.timer -= dt;
      if (t.timer <= 0) {
        t.fireAng = t.ang;
        spawnBullet(t.x + Math.cos(t.ang) * 26, t.y + Math.sin(t.ang) * 26, t.ang, 90);
        t.state = 'cooldown';
        t.timer = rand(8, 10);
      }
    }
  }
}
function destroyTurret(t) {
  const i = turrets.indexOf(t);
  if (i >= 0) turrets.splice(i, 1);
  score += 250; kills++; stats.turrets++;
  addPopup(t.x, t.y - 30, '炮台摧毁 +250', '#7fe9ff');
  addBurst(t.x, t.y, 34, '#00f6ff', 240, 0.3);

/* ---------------- Bullets & Spikes ---------------- */
function spawnBullet(x, y, ang, speed) {
  const sp = speed || 150;
  bullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 7, life: 6 });
}
function removeBullet(b) { const i = bullets.indexOf(b); if (i >= 0) bullets.splice(i, 1); }
function updateBullets(dt) {
  for (const b of [...bullets]) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) { removeBullet(b); continue; }
    let consumed = false;
    // bombs are immune to freeze: a bullet detonates them instead
    for (const bm of [...bombs]) {
      if (!bm.exploded && dist(b, { x: bombScreenX(bm), y: bombScreenY(bm) }) < b.r + 9) {
        explodeBomb(bm);
        consumed = true;
        break;
      }
    }
    if (consumed) { removeBullet(b); continue; }
    if (!player.dead && dist(b, player) < b.r + player.r) { freezePlayer(3); consumed = true; }
    if (consumed) { removeBullet(b); continue; }
    for (const h of [...hammers]) {
      const hp = hammerPos(h);
      if (Math.abs(b.x - hp.x) < b.r + h.hw && Math.abs(b.y - hp.y) < b.r + h.hh) { h.frozen = 3; consumed = true; break; }
    }
    if (consumed) { removeBullet(b); continue; }
    for (const bk of [...blacks]) {
      if (dist(b, bk) < b.r + bk.r) { wakeBlack(bk); bk.frozen = 3; consumed = true; break; }
    }
    if (consumed) { removeBullet(b); continue; }
    for (const s of [...snakes]) {
      if (dist(b, s.segments[0]) < b.r + 16) { s.frozen = 3; consumed = true; break; }
    }
    if (consumed) removeBullet(b);
  }
}
function updateSpikes(dt) {
  const p = player;
  for (const s of [...spikes]) {
    s.t -= dt;
    if (s.t <= 0) { spikes.splice(spikes.indexOf(s), 1); continue; }
    for (const b of [...bombs]) {
      if (!b.carried && !b.exploded && dist({ x: b.x, y: b.y }, { x: s.x, y: s.y }) < 26) explodeBomb(b);
    }
    if (!p.dead && Math.abs(p.x - s.x) < 15 && Math.abs(p.y - groundY) < 26) damagePlayer(2, s.x, groundY);
  }
}

/* ---------------- FX ---------------- */
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color: color || '#c9fbff', life: 1.2, maxLife: 1.2 });
}
function addBurst(x, y, count, colors, speed, grav) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(speed * 0.3, speed);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.4, 0.9), maxLife: 0.9, size: rand(1.5, 3.5),
      color: Array.isArray(colors) ? pick(colors) : colors, grav: grav || 0
    });
  }
}
function addShockwave(x, y, maxR) {
  shockwaves.push({ x, y, r: 10, maxR, life: 0.45, maxLife: 0.45 });
}
function updateParticles(dt) {
  for (const p of [...particles]) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.grav || 0) * dt * 60;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= dt;
    if (p.life <= 0) particles.splice(particles.indexOf(p), 1);
  }
  for (const w of [...shockwaves]) {
    w.r += (w.maxR - w.r) * dt * 4;
    w.life -= dt;
    if (w.life <= 0) shockwaves.splice(shockwaves.indexOf(w), 1);
  }
  for (const pp of [...popups]) {
    pp.y -= 26 * dt;
    pp.life -= dt;
    if (pp.life <= 0) popups.splice(popups.indexOf(pp), 1);
  }
}

/* ---------------- Upgrades ---------------- */
const UPGRADES = [
  { id: 'speed', name: '速度 +20%', desc: '移动速度提升，最多叠加至 +60%。', avail: () => player.speedMul < 1.6, apply: () => { player.speedMul += 0.2; showHint('速度 +20%', 2.5); } },
  { id: 'maxhp', name: '生命上限 +2', desc: '生命上限 +2 并恢复 2 点生命。', avail: () => player.maxHp < 10, apply: () => { player.maxHp += 2; player.hp = Math.min(player.maxHp, player.hp + 2); showHint('生命上限 +2', 2.5); } },
  { id: 'bomb', name: '炸弹精通', desc: '搬运加速，爆炸范围 +30%（最多 +50%）。', avail: () => bombRadiusUp < 2, apply: () => { bombRadiusUp++; showHint('爆炸范围 +30%', 2.5); } },
  { id: 'shield', name: '护盾 3 秒', desc: '受伤后 3 秒无敌，可升级为 5 秒。', avail: () => player.shield < 5, apply: () => { player.shield = player.shield >= 3 ? 5 : 3; showHint(player.shield >= 5 ? '护盾 5 秒' : '护盾 3 秒', 2.5); } }
];
function addEnergy(n) { energy = Math.min(100, energy + n); }

/* ---------------- Power orbs (Contra-style, no popup) ---------------- */
function spawnOrb(over) {
  orbsSpawned++;
  const bonus = over && over.bonus !== undefined ? over.bonus : pityActive;
  pityActive = false;
  const fromTop = over && over.fromTop !== undefined ? over.fromTop : true;
  const o = {
    x: fromTop ? rand(70, W - 70) : W + 40,
    y: fromTop ? -40 : rand(H * 0.3, groundY - 120),
    vx: fromTop ? rand(-10, 10) : -rand(40, 60),
    vy: fromTop ? rand(30, 50) : 0,
    r: bonus ? 18 : 13,
    hoverY: over && over.y !== undefined ? over.y : rand(H * 0.25, groundY - 140),
    hoverX: rand(80, W - 80),
    bonus, fromTop, life: 0, wob: rand(0, TAU)
  };
  if (over) Object.assign(o, over);
  orbs.push(o);
  showHint(bonus ? '保底升级球！吃到后连升 2 级！' : '升级球出现，快去拾取！', 4);
  sfx.pickup();
  return o;
}
function updateOrbs(dt) {
  if (state === 'playing' && orbsSpawned < orbMax && !bossDefeated) {
    orbTimer -= dt;
    if (orbTimer <= 0) { orbTimer = rand(40, 55); spawnOrb(); }
  }
  const p = player;
  for (const o of [...orbs]) {
    o.life += dt; o.wob += dt * 3;
    if (o.fromTop) {
      if (o.y < o.hoverY) {
        o.y += o.vy * dt;
        o.x += o.vx * dt;
        o.vy = Math.min(55, o.vy + 4 * dt);
      } else {
        o.y = o.hoverY + Math.sin(o.wob * 2) * 5;
        o.x += o.vx * 0.1 * dt;
      }
    } else {
      o.x += o.vx * dt;
      o.vx *= Math.max(0, 1 - 1.5 * dt);
      if (Math.abs(o.vx) < 6) o.y = o.hoverY + Math.sin(o.wob * 2) * 5;
    }
    if (p && !p.dead && dist(p, o) < o.r + p.r + 12) { collectOrb(o); continue; }
    const off = o.y > H + 40 || o.x < -40 || o.x > W + 40;
    if (off || o.life > 25) {
      const i = orbs.indexOf(o);
      if (i >= 0) orbs.splice(i, 1);
      pityActive = true;
      addPopup(clamp(o.x, 80, W - 80), clamp(o.y, H * 0.3, H - 60), '错过升级球 — 下次保底！', '#ffd9a0');
      sfx.death();
    }
  }
}
function collectOrb(o) {
  const i = orbs.indexOf(o);
  if (i >= 0) orbs.splice(i, 1);
  const p = player;
  if (!p || p.dead) return;
  const applyOne = () => {
    const pool = UPGRADES.filter(u => u.avail());
    if (!pool.length) return null;
    const u = pick(pool);
    u.apply();
    upgradesUsed++;
    addPopup(p.x, p.y - 40, (o.bonus ? '保底·' : '') + u.name, '#38ffb0');
    return u;
  };
  const first = applyOne();
  if (o.bonus) applyOne();
  if (first) {
    addPopup(p.x, p.y - 22, o.bonus ? '保底升级！' : '升级完成！', o.bonus ? '#ffd9a0' : '#c9fbff');
    sfx.upgrade();
  }
}

/* ---------------- Pickups (weighted by player state) ---------------- */
const PICKUP_COLOR = { heal: '#ff5c9d', shield: '#00f6ff', speed: '#38ffb0', bomb: '#ff9e2c' };
const PICKUP_LABEL = { heal: '血', shield: '盾', speed: '速', bomb: '弹' };
function pickupWeights() {
  const p = player;
  if (!p) return { heal: 0.25, shield: 0.25, speed: 0.25, bomb: 0.25 };
  const hpFrac = p.hp / p.maxHp;
  const hasShield = p.invuln > 0 || p.shield >= 3;
  if (hpFrac < 0.5) return { heal: 0.5, shield: 0.17, speed: 0.165, bomb: 0.165 };
  if (!hasShield) return { heal: 0.2, shield: 0.4, speed: 0.2, bomb: 0.2 };
  return { heal: 0.2, shield: 0.2, speed: 0.3, bomb: 0.3 };
}
function weightedPickupType() {
  const w = pickupWeights();
  let r = Math.random();
  for (const t of PICKUP_TYPES) {
    r -= w[t];
    if (r <= 0) return t;
  }
  return 'heal';
}
function spawnPickup(type, x, y) {
  const pu = {
    type: type || weightedPickupType(),
    x: x !== undefined ? x : rand(40, W - 40),
    y: y !== undefined ? y : -30,
    r: 13, vy: rand(45, 70), wob: rand(0, TAU), life: 0
  };
  pickups.push(pu);
  return pu;
}
function updatePickups(dt) {
  if (state === 'playing' && pickups.length < 3) {
    pickupTimer -= dt;
    if (pickupTimer <= 0) { pickupTimer = rand(9, 15); spawnPickup(); }
  }
  const p = player;
  for (const pu of [...pickups]) {
    pu.y += pu.vy * dt;
    pu.wob += dt * 3;
    pu.life += dt;
    if (p && !p.dead && dist(p, pu) < pu.r + p.r + 10) {
      applyPickup(pu);
      const i = pickups.indexOf(pu);
      if (i >= 0) pickups.splice(i, 1);
      continue;
    }
    if (pu.y > H + 30 || pu.life > 18) {
      const i = pickups.indexOf(pu);
      if (i >= 0) pickups.splice(i, 1);
    }
  }
}
function applyPickup(pu) {
  const p = player;
  if (!p || p.dead) return;
  let text = '';
  if (pu.type === 'heal') {
    p.hp = Math.min(p.maxHp, p.hp + 1);
    text = '+1 生命';
  } else if (pu.type === 'shield') {
    p.invuln = Math.max(p.invuln, 3);
    text = '护盾 3 秒';
  } else if (pu.type === 'speed') {
    p.speedMul = Math.min(1.9, p.speedMul + 0.1);
    text = '速度 +10%';
  } else if (pu.type === 'bomb') {
    p.carryCap = Math.min(3, p.carryCap + 1);
    text = '炸弹容量 +1';
  }
  addPopup(p.x, p.y - 34, text, PICKUP_COLOR[pu.type]);
  sfx.upgrade();
}

/* ---------------- Level progression ---------------- */
function updateLevel(dt) {
  if (elapsed >= 24 && phase < 2) {
    phase = 2;
    showHint('黑怪入场！可刷高阶段赚分（阶段越高得分越高），或用炸弹炸掉', 5);
  }
  if (elapsed >= 55 && phase < 3) {
    phase = 3;
    showHint('冰冻炮台启动 — 它的子弹会冰冻一切（冰冻期间伤害 ×2）', 5);
    if (!turretSpawned) { turretSpawned = true; spawnTurret(); }
  }
  if (elapsed >= 95 && phase < 4) {
    phase = 4;
    showHint('红蛇王登场！炸它中段可分裂 — 它留下的尖刺会引爆炸弹', 6);
    if (!bossSpawned) { bossSpawned = true; spawnBoss(); }
  }
  if (phase >= 2 && !blackSpawned) { blackSpawned = true; blacks.push(spawnBlack(1)); }
  if (!bossDefeated && hammers.length < 2) {
    hammerTimer -= dt;
    if (hammerTimer <= 0) { hammerTimer = rand(8, 13); spawnHammerElite(); }
  }
}

/* ---------------- Update ---------------- */
function updateGame(dt) {
  elapsed += dt;
  score += dt * 10; // survival time score
  updateLevel(dt);
  updateBombs(dt);
  updateHammers(dt);
  updateTurret(dt);
  updateBullets(dt);
  updateBlacks(dt);
  updateSnakes(dt);
  updateSpikes(dt);
  updateOrbs(dt);
  updatePickups(dt);
  updatePlayer(dt);
  updateParticles(dt);
  updateStars(dt);
  if (hintTimer > 0) hintTimer -= dt;
  shake = Math.max(0, shake - dt * 22);
  hitFlash = Math.max(0, hitFlash - dt * 1.6);
  freezeFlash = Math.max(0, freezeFlash - dt * 1.6);
}
function updatePlayer(dt) {
  const p = player;
  if (!p || p.dead) return;
  if (p.invuln > 0) p.invuln -= dt;
  const beingPushed = hammers.some(h => h.pushingPlayer && h.state === 'strike');
  if (beingPushed) {
    p.vy = 200; // carried down by the hammer head
  } else if (p.frozen > 0) {
    p.frozen -= dt;
  } else {
    let dx = 0, dy = 0;
    if (keys.KeyA || keys.ArrowLeft) dx -= 1;
    if (keys.KeyD || keys.ArrowRight) dx += 1;
    if (keys.KeyW || keys.ArrowUp) dy -= 1;
    if (keys.KeyS || keys.ArrowDown) dy += 1;
    if (dx || dy) {
      const l = Math.hypot(dx, dy);
      dx /= l; dy /= l;
      const sp = p.baseSpeed * p.speedMul;
      p.x += dx * sp * dt;
      p.y += dy * sp * dt;
      p.vy = dy * sp;
      clampPlayer();
    } else {
      p.vy *= Math.max(0, 1 - 8 * dt);
    }
  }
  // engine trail (jet exhaust downward, behind the nose-up plane)
  p.engT -= dt;
  if (p.engT <= 0) {
    p.engT = 0.04;
    particles.push({
      x: p.x + rand(-2, 2), y: p.y + 15,
      vx: rand(-14, 14), vy: rand(60, 150),
      life: rand(0.25, 0.5), maxLife: 0.5, size: rand(1.5, 3),
      color: pick(['#00f6ff', '#38ffb0', '#ff9e2c', '#ffffff']), grav: 0
    });
  }
}
function updateStars(dt) {
  for (const s of stars) {
    s.y += (24 + 44 * s.depth) * dt;
    if (s.y > H + 2) s.y -= H;
    s.tw += dt * 2;
  }
}
function showHint(text, dur) { hintText = text; hintTimer = dur; }
function turnToward(a, t, maxStep) {
  let d = (t - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + clamp(d, -maxStep, maxStep);
}

/* ---------------- Render ---------------- */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#04050c';
  ctx.fillRect(0, 0, W, H);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  renderStars();
  renderGrid();
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  renderSpikes();
  renderBombs();
  renderOrbs();
  renderPickups();
  renderHammers();
  renderTurret();
  renderBullets();
  renderBlacks();
  renderSnakes();
  renderPlayer();
  renderParticles();
  renderPopups();
  ctx.restore();
  renderHUD();
  if (hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,45,120,' + (0.3 * hitFlash).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (freezeFlash > 0) {
    ctx.fillStyle = 'rgba(127,233,255,' + (0.22 * freezeFlash).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function renderOrbs() {
  for (const o of orbs) {
    const pulse = 1 + Math.sin(o.wob * 2) * 0.18;
    const col = o.bonus ? '#ffd9a0' : (Math.floor(o.wob) % 2 ? '#00f6ff' : '#38ffb0');
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(o.x, o.y, (o.r + 9) * pulse, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowColor = col;
    ctx.shadowBlur = o.bonus ? 26 : 14;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.25, 0, TAU);
    ctx.fill();
    if (o.bonus) {
      ctx.font = 'bold 10px ' + GAME_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd9a0';
      ctx.shadowColor = '#ff9e2c';
      ctx.shadowBlur = 8;
      ctx.fillText('保底', o.x, o.y + o.r + 11);
      ctx.shadowBlur = 0;
    }
  }
}
function renderPickups() {
  for (const pu of pickups) {
    const col = PICKUP_COLOR[pu.type];
    const pulse = 1 + Math.sin(pu.wob * 2) * 0.15;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, pu.r * 1.5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, pu.r * pulse, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = 'bold 12px ' + GAME_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PICKUP_LABEL[pu.type], pu.x, pu.y + 1);
    ctx.shadowBlur = 0;
  }
}
function renderStars() {
  for (const s of stars) {
    const a = 0.35 + 0.4 * Math.abs(Math.sin(s.tw));
    ctx.fillStyle = 'rgba(201,251,255,' + a.toFixed(2) + ')';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
}
function renderGrid() {
  // scrolling flight grid: horizontal lines stream downward to suggest forward flight
  ctx.strokeStyle = 'rgba(0,246,255,0.07)';
  ctx.lineWidth = 1;
  const off = (elapsed * 120) % 90;
  for (let y = -off; y < H + 90; y += 90) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,246,255,0.045)';
  for (let x = 0; x < W; x += 110) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  // bottom flight boundary
  ctx.strokeStyle = 'rgba(0,246,255,0.25)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.setLineDash([]);
}
function renderBombs() {
  for (const b of bombs) {
    const x = bombScreenX(b), y = bombScreenY(b);
    const pulse = 1 + Math.sin(b.wob * 3) * 0.12;
    ctx.fillStyle = 'rgba(255,158,44,0.18)';
    ctx.beginPath();
    ctx.arc(x, y, b.r + 8 * pulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ff9e2c';
    ctx.shadowColor = '#ff9e2c';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(x, y, b.r * pulse, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a1f05';
    ctx.beginPath();
    ctx.arc(x, y, b.r * 0.5 * pulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffd9a0';
    ctx.font = 'bold 10px ' + GAME_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', x, y + 1);
  }
}
function renderHammers() {
  for (const h of hammers) {
    const hp = hammerPos(h);
    const frozen = h.frozen > 0;
    const col = frozen ? '#7fe9ff' : (h.cracked ? '#ff5c9d' : '#ff2d78');
    // telegraph: pulsing target marker + soft column highlight
    if (h.state === 'telegraph') {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 90);
      ctx.fillStyle = 'rgba(255,92,157,' + (0.05 * pulse).toFixed(3) + ')';
      ctx.fillRect(h.x - h.hw, 0, h.hw * 2, H);
      ctx.strokeStyle = 'rgba(255,92,157,' + pulse.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.rect(h.x - h.hw, h.targetY - h.hh, h.hw * 2, h.hh * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,92,157,' + (0.1 * pulse).toFixed(2) + ')';
      ctx.beginPath();
      ctx.rect(h.x - h.hw, h.targetY - h.hh, h.hw * 2, h.hh * 2);
      ctx.fill();
    }
    // handle: from head top up off-screen
    ctx.strokeStyle = col;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(h.x, hp.y - h.hh);
    ctx.lineTo(h.x, -40);
    ctx.stroke();
    // hammer head: glowing rectangle
    ctx.fillStyle = frozen ? '#bfefff' : '#ff2d78';
    ctx.shadowBlur = 18;
    ctx.fillRect(hp.x - h.hw, hp.y - h.hh, h.hw * 2, h.hh * 2);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(hp.x - h.hw, hp.y - h.hh, h.hw * 2, h.hh * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(hp.x - h.hw + 4, hp.y - h.hh + 4, h.hw * 2 - 8, 8);
    if (h.cracked) {
      ctx.strokeStyle = '#ffd9a0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hp.x - 8, hp.y - h.hh + 6);
      ctx.lineTo(hp.x + 2, hp.y + 2);
      ctx.lineTo(hp.x - 4, hp.y + h.hh - 6);
      ctx.moveTo(hp.x + 6, hp.y - h.hh + 10);
      ctx.lineTo(hp.x + 12, hp.y - 4);
      ctx.stroke();
    }
    // elite HP bar (2 segments) — shown above the head, or at the target during telegraph
    const bw = h.hw * 2, bx = hp.x - bw / 2;
    const by = h.state === 'telegraph' ? h.targetY - h.hh - 16 : hp.y - h.hh - 16;
    ctx.fillStyle = 'rgba(4,5,12,0.7)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 8);
    ctx.fillStyle = 'rgba(255,92,157,0.25)';
    ctx.fillRect(bx, by, bw, 6);
    ctx.fillStyle = frozen ? '#7fe9ff' : '#ff2d78';
    ctx.fillRect(bx, by, bw * (h.hp / h.maxHp), 6);
    ctx.strokeStyle = 'rgba(255,92,157,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 6);
    ctx.strokeStyle = 'rgba(255,92,157,0.35)';
    ctx.beginPath();
    ctx.moveTo(bx + bw / 2, by);
    ctx.lineTo(bx + bw / 2, by + 6);
    ctx.stroke();
    ctx.font = 'bold 9px ' + GAME_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 6;
    ctx.fillText('精英锤兵', hp.x, by - 2);
    ctx.shadowBlur = 0;
    // frozen: cyan frost overlay
    if (frozen) {
      ctx.fillStyle = 'rgba(127,233,255,0.3)';
      ctx.fillRect(hp.x - h.hw, hp.y - h.hh, h.hw * 2, h.hh * 2);
    }
  }
}
function renderTurret() {
  for (const t of turrets) {
    const frozen = t.frozen > 0;
    const col = frozen ? '#7fe9ff' : '#00f6ff';
    if (t.state === 'aim' || t.state === 'fire') {
      ctx.strokeStyle = 'rgba(0,246,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = '#0a1220';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.shadowColor = col;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = col;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(t.x + Math.cos(t.ang) * 8, t.y + Math.sin(t.ang) * 8);
    ctx.lineTo(t.x + Math.cos(t.ang) * 30, t.y + Math.sin(t.ang) * 30);
    ctx.stroke();
    if (t.state === 'cooldown') {
      // cooling ring: no laser during this long phase
      const p = 1 - clamp(t.timer / 10, 0, 1);
      ctx.strokeStyle = 'rgba(0,246,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * p);
      ctx.stroke();
      ctx.font = 'bold 9px ' + GAME_FONT;

function renderSnakes() {

        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(segs[i - 1].x, segs[i - 1].y);

      ctx.fillStyle = col;

      ctx.shadowBlur = i === 0 ? 16 : 8;

/* ---------------- HUD ---------------- */
function heartPath(s) {
  ctx.beginPath();
  const n = 24;
  for (let i = 0; i <= n; i++) {
    const t = i / n * TAU;
    const x = 16 * Math.pow(Math.sin(t), 3) * s;
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawHeartAt(x, y, st) {
  ctx.save();
  ctx.translate(x, y);
  const s = 0.62;
  if (st === 0) {
    heartPath(s);
    ctx.strokeStyle = 'rgba(255,45,120,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else {
    heartPath(s);
    ctx.fillStyle = 'rgba(255,45,120,0.32)';
    ctx.fill();
    if (st === 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(-20 * s, -18 * s, 20 * s, 40 * s);
      ctx.clip();
      heartPath(s);
      ctx.fillStyle = '#ff2d78';
      ctx.shadowColor = '#ff2d78';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    } else {
      heartPath(s);
      ctx.fillStyle = '#ff2d78';
      ctx.shadowColor = '#ff2d78';
      ctx.shadowBlur = 12;
      ctx.fill();
    }
  }
  ctx.restore();
}
function renderHUD() {
  // hearts (1 heart = 2 hp)
  const heartsTotal = player ? Math.ceil(player.maxHp / 2) : 3;
  for (let i = 0; i < heartsTotal; i++) {
    const hp = player ? player.hp : 6;
    const st = hp >= (i + 1) * 2 ? 2 : hp === i * 2 + 1 ? 1 : 0;
    drawHeartAt(22 + i * 21, 28, st);
  }
  if (player) {
    ctx.font = 'bold 13px ' + GAME_FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#d9fdff';
    ctx.shadowColor = '#00f6ff';
    ctx.shadowBlur = 8;
    ctx.fillText('得分 ' + String(Math.floor(score)).padStart(6, '0'), 18, 46);
    ctx.shadowBlur = 0;
    ctx.font = '11px ' + GAME_FONT;
    ctx.fillStyle = 'rgba(201,251,255,0.7)';
    const mm = Math.floor(elapsed / 60), ss = Math.floor(elapsed % 60);
    ctx.fillText('时间 ' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'), 18, 64);
    ctx.fillText('阶段 ' + phase + '/4   击杀 ' + kills, 18, 80);
    // energy (from kills; upgrades come from power orbs)
    ctx.fillText('能量', 18, 98);
    ctx.fillStyle = 'rgba(201,251,255,0.15)';
    ctx.fillRect(18, 110, 90, 6);
    const frac = Math.min(1, energy / 100);
    ctx.fillStyle = '#38ffb0';
    ctx.shadowColor = '#38ffb0';
    ctx.shadowBlur = 6;
    ctx.fillRect(18, 110, 90 * frac, 6);
    ctx.shadowBlur = 0;
    if (energy >= 100) {
      ctx.fillStyle = 'rgba(56,255,176,0.8)';
      ctx.font = '9px ' + GAME_FONT;
      ctx.fillText('满', 112, 108);
    }
    // boss HP bar
    if (bossSpawned && !bossDefeated) {
      const bw = Math.min(420, W * 0.42), bx = (W - bw) / 2;
      ctx.font = 'bold 10px ' + GAME_FONT;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff2d78';
      ctx.shadowColor = '#ff2d78';
      ctx.shadowBlur = 8;
      ctx.fillText('红蛇王', W / 2, 14);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,45,120,0.15)';
      ctx.fillRect(bx, 26, bw, 10);
      const frac2 = clamp(totalBossHp() / bossMaxHp, 0, 1);
      ctx.fillStyle = '#ff2d78';
      ctx.shadowColor = '#ff2d78';
      ctx.shadowBlur = 8;
      ctx.fillRect(bx, 26, bw * frac2, 10);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,45,120,0.5)';
      ctx.strokeRect(bx, 26, bw, 10);
    }
    if (player.carrying.length) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px ' + GAME_FONT;
      ctx.fillStyle = '#ff9e2c';
      ctx.shadowColor = '#ff9e2c';
      ctx.shadowBlur = 8;
      const tag = player.carrying.length > 1 ? '已拾取炸弹 ×' + player.carrying.length : '已拾取炸弹';

      ctx.shadowBlur = 0;

    if (hintTimer > 0 && hintText) {
      ctx.globalAlpha = Math.min(1, hintTimer);

      ctx.font = 'bold 12px ' + GAME_FONT;

      ctx.shadowColor = '#00f6ff';
      ctx.shadowBlur = 8;
      ctx.fillText(hintText, W / 2, H - 34);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }
  ctx.font = '10px ' + GAME_FONT;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,45,120,0.8)';
  ctx.fillText('最佳 ' + String(Math.floor(best)).padStart(6, '0'), W - 12, 8);
}

/* ---------------- Flow ---------------- */
function resetGame() {
  elapsed = 0; score = 0; kills = 0; upgradesUsed = 0;
  hammers = []; blacks = []; snakes = []; turrets = []; bullets = []; spikes = []; bombs = [];
  particles = []; shockwaves = []; popups = [];
  pickups = []; pickupTimer = rand(8, 14);
  phase = 1; bossSpawned = false; bossDefeated = false; bossMaxHp = 0;
  bombRadiusUp = 0; bombTimer = 1.5; hammerTimer = 3;
  stats = { hammers: 0, blacks: 0, turrets: 0, boss: 0 };
  hintText = ''; hintTimer = 0;
  orbs = []; orbTimer = rand(40, 55); orbsSpawned = 0; pityActive = false; energy = 0;
  blackSpawned = false; turretSpawned = false;
  player = makePlayer();
  spawnHammerPair();
  showHint('拾取橙色炸弹，放在锤兵砸击路径上，然后跑开！', 6);
}
function startGame() {
  if (state === 'playing') return;
  initAudio();
  resetGame();
  state = 'playing';
  for (const o of [menuOverlay, pauseOverlay, overOverlay, victoryOverlay]) o.classList.add('hidden');
  sfx.click();
}
function togglePause() {
  if (state === 'playing') pauseGame();
  else if (state === 'paused') resumeGame();
}
function pauseGame() {
  if (state !== 'playing') return;
  state = 'paused';
  pauseOverlay.classList.remove('hidden');
}
function resumeGame() {
  if (state !== 'paused') return;
  state = 'playing';
  pauseOverlay.classList.add('hidden');
}
function gameOver() {
  state = 'over';
  const final = Math.floor(score);
  if (final > best) {
    best = final;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  overScore.textContent = final.toLocaleString();
  overBest.textContent = best.toLocaleString();
  overOverlay.classList.remove('hidden');
  sfx.death();
  addBurst(player.x, player.y, 40, '#00f6ff', 260, 0.3);
}
function victoryScreen() {
  state = 'victory';
  const final = Math.floor(score);
  if (final > best) {
    best = final;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  const mm = Math.floor(elapsed / 60), ss = Math.floor(elapsed % 60);
  vicScoreTime.textContent = final.toLocaleString() + ' · ' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  vicBest.textContent = best.toLocaleString();
  victoryStats.innerHTML =
    '<div>精英锤兵摧毁 <b>' + stats.hammers + '</b></div>' +
    '<div>黑怪击杀 <b>' + stats.blacks + '</b></div>' +
    '<div>炮台摧毁 <b>' + stats.turrets + '</b></div>' +
    '<div>蛇王节段 <b>' + stats.boss + '</b></div>' +
    '<div>升级次数 <b>' + upgradesUsed + '</b></div>';
  victoryOverlay.classList.remove('hidden');
  sfx.victory();
}
function checkVictory() {
  if (state !== 'playing' || !bossSpawned) return;
  if (snakes.length === 0 && !bossDefeated) {
    bossDefeated = true;
    showHint('红蛇王已被摧毁！清除锤兵与炮台即可通关', 5);
    sfx.split();
  }
  if (bossDefeated && hammers.length === 0 && turrets.length === 0) victoryScreen();
}
startBtn.addEventListener('click', startGame);
retryBtn.addEventListener('click', startGame);
vicRetryBtn.addEventListener('click', startGame);

/* ---------------- Main loop ---------------- */
let lastFrame = performance.now();
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  if (dt > 0) {
    if (state === 'playing') {
      updateGame(dt);
    } else {
      updateStars(dt);
      updateParticles(dt);
      if (hintTimer > 0) hintTimer -= dt;
      shake = Math.max(0, shake - dt * 22);
    }
    render();
  }
}

resize();
render();
requestAnimationFrame(loop);

  testFreeze: () => freezePlayer(3),
  spawnBossTest: () => { if (!bossSpawned) { bossSpawned = true; spawnBoss(); } },
  midSegment: () => { const s = snakes[0]; return s ? s.segments[Math.floor(s.segments.length / 2)] : null; },
  snakeInfo: () => snakes.map(s => ({ headAng: s.headAng, distAcc: s.distAcc, headX: s.segments[0].x, headY: s.segments[0].y, speed: 93.75 })),
  pickupWeights: () => pickupWeights(),
  weightedPickupType: () => weightedPickupType(),
  spawnPickup: (type, x, y) => spawnPickup(type, x, y),
  spawnTurretTest: () => { if (!turretSpawned) { turretSpawned = true; spawnTurret(); } },
  turretInfo: () => turrets.map(t => ({ state: t.state, timer: t.timer, ang: t.ang, x: t.x, y: t.y })),
  setTurretState: (st, timer) => { if (turrets[0]) { turrets[0].state = st; turrets[0].timer = timer !== undefined ? timer : 0.01; } },
  bullets: () => bullets.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, life: b.life })),
  starsInfo: () => ({ count: stars.length, s0y: stars[0] ? stars[0].y : 0, s0depth: stars[0] ? stars[0].depth : 0 }),
  setKills: (n) => { kills = n; },
  stats: () => ({
    score: Math.floor(score), kills, upgradesUsed, phase,
    hp: player ? player.hp : 0, maxHp: player ? player.maxHp : 0,
    carrying: player ? player.carrying.length : 0, carryCap: player ? player.carryCap : 0,
    hammers: hammers.length, turrets: turrets.length, snakes: snakes.length, bombs: bombs.length,
    pickups: pickups.length, turretState: turrets[0] ? turrets[0].state : null,
    bossDefeated, bossSpawned, frozen: player ? player.frozen : 0, invuln: player ? player.invuln : 0,
    hint: hintText,
    orbs: orbs.length, energy: Math.floor(energy), pityActive,
    hammerCols: hammers.map(h => h.col),
    px: player ? player.x : 0, py: player ? player.y : 0
  })
};
</script>
